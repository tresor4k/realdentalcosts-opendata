[package]
name = "realdentalcosts-data"
version = "0.1.1"
edition = "2021"
description = "US dental cost index 2026 for all 50 states + DC: estimated single-implant price (editorial estimate, edition 2026.1, not collected prices), restorative cost index and cost-of-living index, with a zero-dependency lookup API. Real Dental Costs Data & Research Team (CC BY 4.0, DOI-archived)."
license = "CC-BY-4.0"
homepage = "https://realdentalcosts.com/en/us-dental-cost-index/"
repository = "https://github.com/tresor4k/realdentalcosts-opendata"
documentation = "https://docs.rs/realdentalcosts-data"
keywords = ["dental", "healthcare-prices", "usa", "opendata", "price-comparison"]
categories = ["data-structures"]
readme = "README.md"
include = [
    "src/**/*",
    "data/**/*",
    "README.md",
    "LICENSE",
]

[dependencies]
